<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For My Brother</title>
    <style>
      :root {
        --bg: #f8f5f2;
        --card: #fff;
        --ink: #111827;
        --muted: #6b7280;
        --accent: #ef4444;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 80px 20px 40px;
        text-align: center;
      }
      h1 {
        font-size: clamp(2.25rem, 6vw, 4.5rem);
        margin: 0;
      }
      .sub {
        margin-top: 16px;
        color: var(--muted);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.72rem;
      }
      .card {
        margin-top: 36px;
        background: var(--card);
        border: 1px solid rgba(17,24,39,0.08);
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(17,24,39,0.05);
        padding: 28px 24px;
      }
      p {
        line-height: 1.75;
        font-size: 1.05rem;
      }
      .home {
        display: inline-block;
        margin-top: 24px;
        color: var(--ink);
        text-decoration: none;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 10px 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>For My Brother</h1>
      <div class="sub">A little surprise</div>
      <div class="card">
        <p>Some memories are best kept in little moments. This page is for the joy, the laughter, and the love that always keeps us close.</p>
        <p>May this day remind you that you are always deeply appreciated, celebrated, and loved.</p>
      </div>
      <a class="home" href="../index.html">Back to Home</a>
    </div>
  </body>
</html>
