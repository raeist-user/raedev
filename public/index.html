<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>raedev</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --panel: #111111;
        --text: #f4f4f4;
        --muted: #9ca3af;
        --accent: #ff6b00;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .wrap {
        width: min(900px, 90vw);
        text-align: center;
        padding: 48px 24px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.5rem, 5vw, 5rem);
        letter-spacing: 0.08em;
      }
      .accent { color: var(--accent); }
      .divider {
        width: 80px;
        height: 1px;
        background: rgba(255,255,255,0.2);
        margin: 24px auto;
      }
      p {
        color: var(--muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.75rem;
      }
      .links {
        margin-top: 32px;
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      a {
        color: var(--text);
        text-decoration: none;
        border: 1px solid rgba(255,255,255,0.18);
        padding: 12px 18px;
        border-radius: 999px;
        transition: 0.2s ease;
      }
      a:hover {
        border-color: var(--accent);
        color: var(--accent);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>raedev<span class="accent">_</span></h1>
      <div class="divider"></div>
      <p>Building stuff for fun.</p>
      <div class="links">
        <a href="./fun/surprise.html">Surprise</a>
        <a href="./fun/angel19.html">Angel 19</a>
      </div>
    </main>
  </body>
</html>
